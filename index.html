<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>港股互動 Dashboard · 廣度／轉勢</title>
<style>
:root{--bg:#0b1220;--panel:#121a2b;--panel2:#182338;--border:#243049;--text:#e8eefc;--muted:#8b9bb8;--green:#22c55e;--red:#ef4444;--blue:#38bdf8;--amber:#f59e0b;--chip:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:radial-gradient(1000px 500px at 0% -20%,#1a2744 0%,var(--bg) 50%);color:var(--text);min-height:100vh}
.wrap{max-width:1280px;margin:0 auto;padding:14px 12px 40px}
h1{margin:0;font-size:1.15rem}
.sub{color:var(--muted);font-size:.8rem;margin-top:4px}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),#0f1728);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.card h2{margin:0 0 8px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.idx-lvl{font-size:1.5rem;font-weight:750;margin:2px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:5px 7px;min-width:58px}
.pill .l{display:block;font-size:.65rem;color:var(--muted)}
.pill .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:.8rem}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}
.hint{margin-top:8px;font-size:.78rem;color:#c7e9fb;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.22);padding:7px 9px;border-radius:9px;line-height:1.35}
.filters{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.frow{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chipbtn{flex:0 0 auto;border:1px solid var(--border);background:var(--chip);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:700;cursor:pointer}
.chipbtn.active{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.5);color:var(--text)}
.chipbtn.scene{border-color:rgba(245,158,11,.4);color:#fbbf24}
.chipbtn.scene.active{background:rgba(245,158,11,.18);color:#fde68a}
.chipbtn.watch{border-color:rgba(245,158,11,.35)}
.viewseg{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;width:fit-content;margin:6px 0}
.viewseg button{border:0;background:transparent;color:var(--muted);padding:8px 12px;font-weight:700;font-size:.82rem;cursor:pointer}
.viewseg button.active{background:var(--panel2);color:var(--text)}
.crumb{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.bit{background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:5px 9px;font-size:.75rem;color:var(--muted)}
.bit strong{color:var(--text)}
.bit button{border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:8px}
input[type=search]{width:min(100%,200px);background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:7px 9px;font-size:.8rem}
.scroll{max-height:480px;overflow:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:7px 5px;border-bottom:1px solid var(--border);font-size:.76rem;text-align:left;white-space:nowrap}
th{color:var(--muted);font-size:.64rem;position:sticky;top:0;background:#121a2b;cursor:pointer;z-index:1}
th.sorted{color:var(--blue)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.heat{font-weight:700}
tr.clickable{cursor:pointer}
tr.clickable:hover{outline:1px solid rgba(56,189,248,.35)}
tr.active,tr.selected{background:rgba(56,189,248,.12)}
tr.watch-row{box-shadow:inset 3px 0 0 var(--amber)}
.name-cell{white-space:normal;min-width:110px}
.tag{display:inline-block;padding:1px 6px;border-radius:999px;font-size:.62rem;font-weight:650;margin-left:3px}
.tag-super{background:rgba(245,158,11,.18);color:#fbbf24}
.tag-strong{background:rgba(34,197,94,.15);color:#86efac}
.tag-weak{background:rgba(239,68,68,.15);color:#fca5a5}
.tag-bounce{background:rgba(56,189,248,.15);color:#7dd3fc}
.tag-watch{background:rgba(245,158,11,.22);color:#fcd34d;border:1px solid rgba(245,158,11,.45)}
.meta{color:var(--muted);font-size:.68rem}
.count{color:var(--muted);font-size:.75rem}
footer{color:var(--muted);font-size:.72rem;line-height:1.45;margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:16px}

.note-card{border-color:rgba(245,158,11,.35);background:linear-gradient(180deg,#1a1720,#12101a)}
.note-card h2{color:#fbbf24}
.note-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.note-head .title{font-size:.95rem;font-weight:750}
.note-meta{color:var(--muted);font-size:.72rem}
.note-cols{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:700px){.note-cols{grid-template-columns:1fr}}
.note-col h3{margin:0 0 6px;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.note-col ul{margin:0;padding-left:1.1em;font-size:.78rem;line-height:1.45}
.note-col.cat h3{color:#86efac}.note-col.risk h3{color:#fca5a5}
.note-verdict{margin-top:10px;font-size:.78rem;line-height:1.45;color:#e8eefc;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);padding:8px 10px;border-radius:9px}
.note-disc{margin-top:8px;font-size:.68rem;color:var(--muted);line-height:1.4}
details.note-details{margin-top:6px}
details.note-details summary{cursor:pointer;color:#fcd34d;font-size:.78rem;font-weight:700;list-style:none}
details.note-details summary::-webkit-details-marker{display:none}
.tag-note{background:rgba(167,139,250,.2);color:#ddd6fe;border:1px solid rgba(167,139,250,.4)}
#notePanel{display:none}
#notePanel.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>港股互動 Dashboard</h1>
  <div class="sub">截至 <span id="asOf"></span> · 含廣度％同轉勢觀察黃標</div>
  <div class="grid" id="kpiRow" style="margin-top:10px"></div>
  <div class="filters">
    <div class="frow" id="sceneRow">
      <button type="button" class="chipbtn scene" data-scene="opp">搵機會</button>
      <button type="button" class="chipbtn scene" data-scene="risk">風險掃描</button>
      <button type="button" class="chipbtn scene" data-scene="turn">轉勢觀察</button>
      <button type="button" class="chipbtn" data-scene="reset">重置</button>
    </div>
    <div class="frow" id="idxRow">
      <button type="button" class="chipbtn active" data-idx="all">全部指數</button>
      <button type="button" class="chipbtn" data-idx="hsi">HSI</button>
      <button type="button" class="chipbtn" data-idx="hstech">HSTECH</button>
    </div>
    <div class="frow" id="dirRow">
      <button type="button" class="chipbtn active" data-dir="all">升跌不限</button>
      <button type="button" class="chipbtn" data-dir="up">20d 升</button>
      <button type="button" class="chipbtn" data-dir="down">20d 跌</button>
    </div>
    <div class="frow" id="tagRow">
      <button type="button" class="chipbtn active" data-tag="all">標籤不限</button>
      <button type="button" class="chipbtn" data-tag="超強勢">超強勢</button>
      <button type="button" class="chipbtn" data-tag="持續強">持續強</button>
      <button type="button" class="chipbtn" data-tag="持續弱">持續弱</button>
      <button type="button" class="chipbtn" data-tag="短線反彈">短線反彈</button>
      <button type="button" class="chipbtn watch" data-tag="轉強觀察">轉強觀察</button>
      <button type="button" class="chipbtn watch" data-tag="轉弱觀察">轉弱觀察</button>
    </div>
  </div>
  <div class="viewseg" id="viewSeg">
    <button type="button" data-view="sub" class="active">全部細分</button>
    <button type="button" data-view="ig">全部行業組</button>
  </div>
  <div class="crumb" id="crumb"></div>
  <section class="card">
    <div class="toolbar"><h2 style="margin:0" id="boardTitle">細分行業</h2><span class="count" id="boardCount"></span></div>
    <div class="scroll"><table>
      <thead><tr>
        <th data-b="name">名稱</th><th class="num" data-b="n">#</th>
        <th class="num" data-b="breadth5">5d廣度</th><th class="num" data-b="breadth5Chg">Δ廣度</th>
        <th class="num" data-b="1d">1D</th><th class="num" data-b="5d">5D</th>
        <th class="num" data-b="10d">10D</th><th class="num" data-b="20d">20D</th><th class="num" data-b="30d">30D</th>
      </tr></thead>
      <tbody id="boardBody"></tbody>
    </table></div>
  </section>

  <section class="card note-card" id="notePanel">
    <div class="note-head">
      <div>
        <div class="title" id="noteTitle">產業筆記</div>
        <div class="note-meta" id="noteMeta"></div>
      </div>
      <span class="tag tag-watch" id="noteWatchBadge">轉強觀察</span>
    </div>
    <div class="hint" id="noteTech" style="margin-top:0"></div>
    <details class="note-details" open>
      <summary>展開／收合 · 催化劑 3 · 風險 3</summary>
      <div class="note-cols" style="margin-top:10px">
        <div class="note-col cat"><h3>催化劑</h3><ul id="noteCats"></ul></div>
        <div class="note-col risk"><h3>風險</h3><ul id="noteRisks"></ul></div>
      </div>
      <div class="note-verdict" id="noteVerdict"></div>
      <div class="note-disc" id="noteDisc"></div>
    </details>
  </section>
  <section class="card">
    <div class="toolbar"><h2 style="margin:0" id="stockTitle">成份股</h2><input type="search" id="q" placeholder="搜尋代號／名稱" /></div>
    <div class="scroll"><table>
      <thead><tr>
        <th data-s="code">代號</th><th data-s="nameZh">名稱</th><th data-s="igZh">行業組</th>
        <th class="num" data-s="1d">1D</th><th class="num" data-s="5d">5D</th>
        <th class="num" data-s="10d">10D</th><th class="num" data-s="20d">20D</th><th class="num" data-s="30d">30D</th>
      </tr></thead>
      <tbody id="stockBody"></tbody>
    </table></div>
  </section>
  <footer>轉強觀察：5d&gt;0、20d&lt;0、5d廣度≥50% 且較上日改善、未標持續強／超強勢。<br>轉弱觀察：5d&lt;0、20d&gt;0、5d廣度≤50% 且較上日惡化、未標持續弱。產業筆記由行業分析師提供。資料：HK Indices DB。</footer>
</div>

function tagHtml(item, key){
  let out='';
  if(item.watchUp) out+='<span class="tag tag-watch">轉強觀察</span>';
  if(item.watchDown) out+='<span class="tag tag-watch">轉弱觀察</span>';
  if(item.isSuper) out+='<span class="tag tag-super">超強勢</span>';
  else if(item.isStrong) out+='<span class="tag tag-strong">持續強</span>';
  if(item.isWeak) out+='<span class="tag tag-weak">持續弱</span>';
  if(item.isBounce) out+='<span class="tag tag-bounce">短線反彈</span>';
  const nk=key||item.key||item.igEn;
  if(nk && DATA.industryNotes && DATA.industryNotes[nk]) out+='<span class="tag tag-note">產業筆記</span>';
  return out;
}
function matchIdx(s){ if(state.idx==='all')return true; if(state.idx==='hsi')return s.inHsi; if(state.idx==='hstech')return s.inHstech; return true; }

function matchTag(item){
  if(state.tag==='all') return true;
  if(state.tag==='超強勢') return item.isSuper;
  if(state.tag==='持續強') return item.isStrong;
  if(state.tag==='持續弱') return item.isWeak;
  if(state.tag==='短線反彈') return item.isBounce;
  if(state.tag==='轉強觀察') return !!item.watchUp;
  if(state.tag==='轉弱觀察') return !!item.watchDown;
  return true;
}

function stockUniverse(){
  let rows=DATA.stocks.filter(s=>matchIdx(s)&&matchDir(s.chg));
  if(state.tag==='超強勢') rows=rows.filter(s=>s.isSuper);
  else if(state.tag==='持續強') rows=rows.filter(s=>s.isStrong);
  else if(state.tag==='持續弱') rows=rows.filter(s=>s.isWeak);
  else if(state.tag==='短線反彈') rows=rows.filter(s=>s.isBounce);
  else if(state.tag==='轉強觀察' || state.tag==='轉弱觀察'){
    const keys=new Set(DATA.industryGroups.filter(g=>state.tag==='轉強觀察'?g.watchUp:g.watchDown).map(g=>g.key));
    rows=rows.filter(s=>keys.has(s.igEn));
  }
  if(state.igKey) rows=rows.filter(s=>s.igEn===state.igKey);
  else if(state.subKey) rows=rows.filter(s=>s.subEn===state.subKey);
  if(state.q){ const q=state.q.trim().toLowerCase(); rows=rows.filter(s=>String(s.code).includes(q)||(s.nameZh||'').toLowerCase().includes(q)||(s.igZh||'').toLowerCase().includes(q)); }
  return rows;
}

    }).map(g=>({key:g.key,nameZh:g.nameZh,nameEn:g.nameEn,n:counts[g.key]||0,chg:g.chg,kind:'ig',subZh:g.subZh,item:g,breadth5:g.breadth5,breadth5Chg:g.breadth5Chg}));
  }
  if(!state.subKey){
    const counts={}; univ.forEach(s=>{if(s.subEn)counts[s.subEn]=(counts[s.subEn]||0)+1;});
    return DATA.subsectors.filter(s=>{
      if((counts[s.key]||0)===0) return false;
      if(!matchDir(s.chg)) return false;
      return matchTag(s);
    }).map(s=>({key:s.key,nameZh:s.nameZh,nameEn:s.nameEn,n:counts[s.key]||0,chg:s.chg,kind:'sub',item:s,breadth5:s.breadth5,breadth5Chg:s.breadth5Chg}));
  }
  const counts={}; univ.filter(s=>s.subEn===state.subKey).forEach(s=>{counts[s.igEn]=(counts[s.igEn]||0)+1;});
  return DATA.industryGroups.filter(g=>g.subEn===state.subKey && (counts[g.key]||0)>0 && matchDir(g.chg) && matchTag(g))
    .map(g=>({key:g.key,nameZh:g.nameZh,nameEn:g.nameEn,n:counts[g.key]||0,chg:g.chg,kind:'ig',subZh:g.subZh,item:g,breadth5:g.breadth5,breadth5Chg:g.breadth5Chg}));
}
function setActive(rowId,attr,val){ document.querySelectorAll('#'+rowId+' .chipbtn').forEach(b=>b.classList.toggle('active', b.getAttribute(attr)===val)); }
function applyScene(scene){
  if(scene==='reset'){ state.idx='all'; state.dir='all'; state.tag='all'; }
  else if(scene==='opp'){ state.idx='all'; state.dir='up'; state.tag='超強勢'; state.view='ig'; state.subKey=null; state.igKey=null; }
  else if(scene==='risk'){ state.idx='all'; state.dir='down'; state.tag='持續弱'; state.view='ig'; state.subKey=null; state.igKey=null; }
  else if(scene==='turn'){ state.idx='all'; state.dir='all'; state.tag='轉強觀察'; state.view='ig'; state.subKey=null; state.igKey=null; }
  state.selectedCode=null; state.boardSort='20d'; state.boardDir=-1; syncChips(); render();
}
function syncChips(){
  setActive('idxRow','data-idx',state.idx); setActive('dirRow','data-dir',state.dir); setActive('tagRow','data-tag',state.tag);
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
}
function renderKpi(){
  $('asOf').textContent=DATA.asOf;
  const nUp=DATA.industryGroups.filter(g=>g.watchUp).length, nDown=DATA.industryGroups.filter(g=>g.watchDown).length;
  $('kpiRow').innerHTML=DATA.indices.map((ix,i)=>{
    const pills=H.map(h=>`<div class="pill"><span class="l">${h.toUpperCase()}</span><span class="v ${cls(ix.chg[h])}">${fmt(ix.chg[h])}</span></div>`).join('');
    const hint=i===0?`<div class="hint">行業組轉勢：轉強觀察 ${nUp} · 轉弱觀察 ${nDown}。可用「轉勢觀察」場景掣。</div>`:'';
    return `<section class="card" style="margin:0"><h2>${ix.name}</h2><div class="idx-lvl">${ix.close.toLocaleString('en-HK',{maximumFractionDigits:0})}</div><div class="pills">${pills}</div>${hint}</section>`;
  }).join('');
}
function renderCrumb(){
  const root=state.view==='ig'?'全部行業組':'全部細分';
  const drilled=state.view==='ig'?!!state.igKey:!!(state.subKey||state.igKey);
  let html=`<span class="bit"><strong>${root}</strong>${drilled?`<button type="button" id="toRoot">返回</button>`:''}</span>`;
  if(state.view==='sub'&&state.subKey){ const sub=DATA.subsectors.find(x=>x.key===state.subKey); html+=`<span class="bit">→ 細分：<strong>${sub?sub.nameZh:state.subKey}</strong>${state.igKey?`<button type="button" id="toSub">返回</button>`:''}</span>`; }
  if(state.igKey){ const ig=DATA.industryGroups.find(x=>x.key===state.igKey); html+=`<span class="bit">→ 行業組：<strong>${ig?ig.nameZh:state.igKey}</strong></span>`; }
  $('crumb').innerHTML=html;
  const r=$('toRoot'); if(r) r.onclick=()=>{state.subKey=null;state.igKey=null;state.selectedCode=null;render();};
  const t=$('toSub'); if(t) t.onclick=()=>{state.igKey=null;state.selectedCode=null;render();};
}
function renderBoard(){
  $('boardTitle').textContent = state.view==='ig' ? '全部行業組' : (state.subKey?'行業組（所選細分）':'細分行業排名');
  let rows=boardRows();
  const k=state.boardSort;
  rows.sort((a,b)=>{
    if(k==='name') return state.boardDir*String(a.nameZh).localeCompare(String(b.nameZh),'zh');
    if(k==='n'||k==='breadth5'||k==='breadth5Chg') return state.boardDir*((a[k]??-999)-(b[k]??-999));
    return state.boardDir*((a.chg[k]??-9)-(b.chg[k]??-9));
  });
  $('boardCount').textContent=`${rows.length} 項`;
  document.querySelectorAll('th[data-b]').forEach(th=>th.classList.toggle('sorted', th.dataset.b===state.boardSort));
  if(!rows.length){ $('boardBody').innerHTML=`<tr><td colspan="9" class="empty">呢個 filter 下冇結果</td></tr>`; return; }
  $('boardBody').innerHTML=rows.map(r=>{
    const active=((r.kind==='sub'&&state.subKey===r.key&&!state.igKey)||(r.kind==='ig'&&state.igKey===r.key))?' active':'';
    const watch=(r.item&&(r.item.watchUp||r.item.watchDown))?' watch-row':'';
    const tags=r.item?tagHtml(r.item,r.key):'';
    const meta=r.subZh?`${r.subZh} · ${r.nameEn}`:r.nameEn;
    const cells=H.map(h=>`<td class="num heat" style="${heatStyle(r.chg[h])}">${fmt(r.chg[h])}</td>`).join('');
    return `<tr class="clickable${active}${watch}" data-kind="${r.kind}" data-key="${r.key}"><td class="name-cell"><strong>${r.nameZh}</strong>${tags}<div class="meta">${meta||''}</div></td><td class="num">${r.n}</td><td class="num">${fmtB(r.breadth5)}</td><td class="num ${cls((r.breadth5Chg||0)/100)}">${fmtChg(r.breadth5Chg)}</td>${cells}</tr>`;
  }).join('');
  $('boardBody').querySelectorAll('tr.clickable').forEach(tr=>{
    tr.onclick=()=>{
      const kind=tr.dataset.kind, key=tr.dataset.key;
      if(kind==='sub'){ state.subKey=key; state.igKey=null; state.selectedCode=null; }
      else { state.igKey=key; state.selectedCode=null; if(state.view==='sub'){ const g=DATA.industryGroups.find(x=>x.key===key); if(g) state.subKey=g.subEn; } else state.subKey=null; }
      render();
    };
  });
}
function renderStocks(){
  let rows=stockUniverse();
  const k=state.stockSort;
  rows.sort((a,b)=>{
    if(H.includes(k)) return state.stockDir*((a.chg[k]??-9)-(b.chg[k]??-9));
    if(k==='code') return state.stockDir*String(a.code).localeCompare(String(b.code),'en',{numeric:true});
    if(k==='nameZh') return state.stockDir*String(a.nameZh||'').localeCompare(String(b.nameZh||''),'zh');
    if(k==='igZh') return state.stockDir*String(a.igZh||'').localeCompare(String(b.igZh||''),'zh');
    return 0;
  });
  let title='成份股';
  if(state.igKey){ const ig=DATA.industryGroups.find(x=>x.key===state.igKey); title=(ig?ig.nameZh:state.igKey)+' 成份股'; }
  else if(state.subKey){ const sub=DATA.subsectors.find(x=>x.key===state.subKey); title=(sub?sub.nameZh:state.subKey)+' 成份股'; }
  $('stockTitle').textContent=`${title} · ${rows.length} 隻`;
  document.querySelectorAll('th[data-s]').forEach(th=>th.classList.toggle('sorted', th.dataset.s===state.stockSort));
  if(!rows.length){ $('stockBody').innerHTML=`<tr><td colspan="8" class="empty">呢個 filter 下冇股票</td></tr>`; return; }
  $('stockBody').innerHTML=rows.map(s=>{
    const sel=s.code===state.selectedCode?' selected':'';
    const cells=H.map(h=>`<td class="num heat" style="${heatStyle(s.chg[h])}">${fmt(s.chg[h])}</td>`).join('');
    return `<tr class="clickable stock${sel}" data-code="${s.code}" data-ig="${s.igEn}" data-sub="${s.subEn||''}"><td>${s.code}</td><td class="name-cell">${s.nameZh||''}${tagHtml(s)}</td><td>${s.igZh||''}</td>${cells}</tr>`;
  }).join('');
  $('stockBody').querySelectorAll('tr.stock').forEach(tr=>{
    tr.onclick=()=>{ state.selectedCode=tr.dataset.code; state.igKey=tr.dataset.ig; if(state.view==='sub') state.subKey=tr.dataset.sub||null; render(); };
  });
}
function bind(){
  $('sceneRow').onclick=e=>{ const b=e.target.closest('[data-scene]'); if(!b)return; applyScene(b.dataset.scene); };
  $('idxRow').onclick=e=>{ const b=e.target.closest('[data-idx]'); if(!b)return; state.idx=b.dataset.idx; syncChips(); render(); };
  $('dirRow').onclick=e=>{ const b=e.target.closest('[data-dir]'); if(!b)return; state.dir=b.dataset.dir; syncChips(); render(); };
  $('tagRow').onclick=e=>{ const b=e.target.closest('[data-tag]'); if(!b)return; state.tag=b.dataset.tag; syncChips(); render(); };
  $('viewSeg').onclick=e=>{ const b=e.target.closest('[data-view]'); if(!b)return; state.view=b.dataset.view; state.subKey=null; state.igKey=null; state.selectedCode=null; syncChips(); render(); };
  document.querySelectorAll('th[data-b]').forEach(th=>{ th.onclick=()=>{ const k=th.dataset.b; if(state.boardSort===k) state.boardDir*=-1; else {state.boardSort=k; state.boardDir=k==='name'?1:-1;} renderBoard(); }; });
  document.querySelectorAll('th[data-s]').forEach(th=>{ th.onclick=()=>{ const k=th.dataset.s; if(state.stockSort===k) state.stockDir*=-1; else {state.stockSort=k; state.stockDir=H.includes(k)?-1:1;} renderStocks(); }; });
  let t; $('q').oninput=e=>{ clearTimeout(t); t=setTimeout(()=>{ state.q=e.target.value; renderStocks(); },120); };
}

function pickNoteKey(){
  const notes=DATA.industryNotes||{};
  if(state.igKey && notes[state.igKey]) return state.igKey;
  // when filtering watches / turn scene, prefer visible watched groups that have notes
  const keys=Object.keys(notes);
  if(!keys.length) return null;
  if(state.tag==='轉強觀察' || state.tag==='轉弱觀察'){
    const match=keys.find(k=>{
      const g=DATA.industryGroups.find(x=>x.key===k);
      if(!g) return false;
      return state.tag==='轉強觀察'?g.watchUp:g.watchDown;
    });
    if(match) return match;
  }
  // if only one note overall and user is on turn-ish view of ig board, show it
  if(keys.length===1 && state.view==='ig' && (state.tag==='轉強觀察'||state.tag==='all')) return keys[0];
  return null;
}
function renderNote(){
  const panel=$('notePanel');
  const key=pickNoteKey();
  const note=key && DATA.industryNotes? DATA.industryNotes[key]:null;
  if(!note){ panel.classList.remove('show'); return; }
  panel.classList.add('show');
  $('noteTitle').textContent='產業筆記 · '+note.title;
  $('noteMeta').textContent=`更新日 ${note.updated}（Asia/Hong_Kong） · 成份 ${note.constituent} · n=${note.n}`;
  $('noteWatchBadge').textContent=note.watch||'轉勢觀察';
  $('noteTech').textContent=note.techNote||'';
  $('noteCats').innerHTML=(note.catalysts||[]).map(t=>`<li>${t}</li>`).join('');
  $('noteRisks').innerHTML=(note.risks||[]).map(t=>`<li>${t}</li>`).join('');
  $('noteVerdict').textContent=note.verdict||'';
  $('noteDisc').textContent=note.disclaimer||'';
}
function render(){ renderKpi(); syncChips(); renderCrumb(); renderBoard(); renderNote(); renderStocks(); }
bind(); render();
</script>
</body>
