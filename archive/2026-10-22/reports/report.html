const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(src){
  const link=s=>s.replace(/(https?:\/\/[^\s；｜，）)]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const il=s=>link(esc(s)).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  let o='',L=null,T=[];const fl=()=>{if(L){o+=`</${L}>`;L=null}};
  const ft=()=>{if(T.length){const r=T.filter(x=>!/^\|\s*:?-/.test(x));o+='<div class="scroll"><table>'+r.map((x,i)=>'<tr>'+x.replace(/^\||\|$/g,'').split('|').map(c=>i?`<td>${il(c.trim())}</td>`:`<th>${il(c.trim())}</th>`).join('')+'</tr>').join('')+'</table></div>';T=[]}};
  for(const raw of src.split('\n')){const l=raw.trimEnd();let m;
    if(/^\|/.test(l)){fl();T.push(l);continue}else ft();
    if(m=l.match(/^(#{1,3})\s+(.*)/)){fl();o+=`<h${m[1].length}>${il(m[2])}</h${m[1].length}>`}
    else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(L!=='ul'){fl();o+='<ul>';L='ul'}o+=`<li>${il(m[1])}</li>`}
    else if(m=l.match(/^\s*\d+\.\s+(.*)/)){if(L!=='ol'){fl();o+='<ol>';L='ol'}o+=`<li>${il(m[1])}</li>`}
    else if(/^---+$/.test(l)){fl();o+='<hr style="border:0;border-top:1px solid #26314f">'}
    else if(!l.trim())fl(); else {fl();o+=`<p>${il(l)}</p>`}}
  fl();ft();return o}
const EMBED={"pharma-specialty-generic": "# 藥品製造（專科／仿製）行業研究報告｜轉強觀察\n\n- **更新日**：2026-10-18（Asia/Hong_Kong）\n- **Dashboard 標籤**：轉強觀察｜行業組「藥品製造（專科／仿製）」｜成份股 03692.HK 翰森製藥（n=1）\n- **技術備註**：技術數據截至 2026-10-16，由 HK Indices DB 提供，本報告未重算。n=1；5d +0.6%、20d −6.8%；5d 廣度 100%（較前值 +100 ppt）；DB 標籤「持續弱＋短線反彈」。單一成份訊號易受個股波動主導。\n- **資料新鮮度**：公司數據以 2025 年報（2026-03／04 刊發）及 2026 中期業績（2026-08）為主；行業統計至 2026 年 1–8 月（國家統計局 2026-09-28）；市值以 2026-10-16 收市計。截至本更新日未見各公司 2026 前三季業績（恒瑞 A 股預定 2026-10-27 公布，來源 4）。\n- **非投資建議。**\n\n---\n\n## 1. 產業運作方式\n\n**產業定位。** 中國藥品製造業由化學藥（創新藥、仿製藥、改良型新藥）、生物藥及中藥構成；HK Indices DB 的「專科／仿製」組對應以處方藥為主、創新藥收入佔比持續上升的企業。2026 年 1–8 月，全國規模以上醫藥製造業營業收入 15,045.6 億元（同比 −0.3%）、利潤總額 2,119.6 億元（+3.9%），顯示行業整體量價趨平、利潤率略升（來源 1）。\n\n**主要商業模式。**\n1. **仿製藥／集採模式**：通用名藥透過國家組織集中帶量採購（「以量換價」）進入公立醫院。第 12 批集採（2026-07-31 開標）65 個品種全部採購成功，327 家企業 521 個產品擬中選，累計 12 批已覆蓋 555 種藥品（來源 2）；媒體統計平均降幅約 63.44%（來源 3）。此模式毛利率低、比拼成本與產能。\n2. **創新藥／醫保談判模式**：獨家創新藥經醫保目錄談判形成支付標準，以價換量。國辦發〔2026〕9 號（2026-04-14 發布）提出優化創新藥首發價格機制，支持高水平創新藥「在上市初期制定與高投入、高風險相符的價格，在一定時期內保持價格相對穩定」，並推動商業健康保險創新藥目錄（來源 5）。2026 年醫保目錄及商保創新藥目錄調整方案已於 2026-05-31 發布（來源 6）。\n3. **對外授權（License-out）模式**：中國藥企以海外權益換取首付款、里程碑及特許權使用費。國家醫保局轉引數據指 2026 年上半年中國創新藥對外授權交易額超過 1,000 億美元（來源 7）；媒體統計共 81 筆、首付款約 50 億美元（來源 8）。\n\n**分銷與收款。** 藥企一般向醫藥經銷商（配送商）銷售，經銷商配送至醫院／藥店；以翰森為例，客戶為藥品經銷商，五大客戶佔銷售不足 30%（來源 9）。公立醫療機構藥品須於省級醫藥採購平台掛網並零差率銷售（來源 5）。\n\n**關鍵成功因素。** (i) 研發管線深度與臨床推進效率（翰森 2026H1 研發開支佔收入 20.9%，來源 10）；(ii) 創新藥收入佔比以對沖仿製藥集採降價；(iii) 醫保准入與商業化團隊覆蓋；(iv) 國際化 BD 與海外監管獲批能力；(v) 原料藥＋製劑一體化與成本控制（國辦發 9 號亦支持「原輔料＋制劑」一體化，來源 5）。\n\n---\n\n## 2. 價值鏈分析\n\n```mermaid\nflowchart LR\n  A[上游：原料藥／中間體、藥用輔料與包材、CRO/CDMO、科研設備] --> B[中游：藥品研發與生產<br/>創新藥｜仿製藥｜生物藥]\n  B --> C[流通：醫藥經銷／配送商]\n  C --> D[終端：公立醫院｜零售藥店｜網上藥店]\n  D --> E[支付方：基本醫保｜商業健康保險｜患者自付]\n  B -.對外授權.-> F[海外藥企：首付款／里程碑／特許權使用費]\n```\n\n| 環節 | 主要內容 | 定價／議價力 |\n|---|---|---|\n| 上游 | 原料藥、輔料、包材、CRO/CDMO | 國辦發 9 號要求防範關鍵輔料、包材無序漲價（來源 5） |\n| 中游 | 創新藥／仿製藥研發生產 | 仿製藥受集採價格約束；創新藥透過首發價與醫保談判定價（來源 2、5） |\n| 流通 | 經銷配送 | 佣金型，藥企一般不委聘經銷商做推廣（翰森，來源 9） |\n| 終端／支付 | 醫院、藥店；醫保＋商保 | 醫保支付標準為核心定價錨（來源 5、6） |\n\n### 主要參與者（市值以 2026-10-16 收市計；HKD→USD 以 7.8476、CNY→USD 以 6.7220 換算，來源 11、12）\n\n#### (1) 翰森製藥｜03692.HK｜Dashboard 成份股\n- **簡介**：中國創新驅動型製藥企業，聚焦抗腫瘤、代謝、自身免疫、CNS、抗感染；在中國產生銷售收入的創新藥共 7 款。2026H1 收入 83.04 億元（+11.7%），創新藥收入 70.92 億元，佔 85.4%；腫瘤領域收入 54.73 億元（佔 65.9%）；溢利 42.58 億元（+35.8%）。2026-06 將 IL-23R 拮抗劑 HS-20118 海外權益授予 Avere（首付款 1.2 億美元、里程碑最高 21.8 億美元）（來源 10）。\n- **主要客戶與營收占比**：客戶為藥品經銷商；2025 年五大客戶佔總銷售不足 30%，無單一客戶佔收入 ≥10%（來源 9、13）。具名客戶：公開資訊有限。\n- **主要供應商**：五大供應商佔採購不足 30%（來源 9）；具名供應商：公開資訊有限。\n- **近 3 年營收與獲利**（人民幣億元；來源 14，S&P Global MI 口徑）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 101.0 | 122.6（+21.3%） | 150.3（+22.6%） |\n| 年內溢利 | 32.8 | 43.7（+33.4%） | 55.5（+27.1%） |\n\n- **市值**：約 1,924.3 億港元 ≈ **245 億美元**（2026-10-16；來源 15）\n\n#### (2) 江蘇恒瑞醫藥｜600276.SH／01276.HK\n- **簡介**：中國最大的創新藥企業之一，覆蓋腫瘤、代謝及心血管、免疫呼吸、神經等領域；2025 年收入 316.3 億元，其中境外收入約 47.7 億元（來源 16）。2026 上半年與 BMS 交易涉及確定性付款 9.5 億美元（媒體統計，來源 8）。\n- **主要客戶與營收占比**：2025 年最大客戶佔總收入 25.82%，前五大客戶佔 55.7%（來源 17）；具名客戶：公開資訊有限。\n- **主要供應商**：最大供應商佔採購 7.68%，前五大佔 28.7%（來源 17）。\n- **近 3 年營收與獲利**（人民幣億元；來源 16）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 228.2 | 279.9（+22.6%） | 316.3（+13.0%） |\n| 淨利潤 | 43.0 | 63.4（+47.3%） | 77.1（+21.7%） |\n\n- **市值**：約 3,071.1 億元人民幣（以 A 股價×A+H 總股本，S&P/SA 口徑）≈ **457 億美元**（2026-10-16；來源 18）\n\n#### (3) 石藥集團｜01093.HK（DB 歸類「藥品製造（綜合）」，作同業參照）\n- **簡介**：綜合型藥企，業務含成藥（神經、腫瘤、抗感染等）、原料藥（維生素 C、抗生素）及功能食品。2025 年收入下滑主因腫瘤等成藥板塊受集採／價格壓力（腫瘤收入由 2023 年 61.4 億元降至 2025 年 22.0 億元），授權費收入 2025 年約 17.9 億元（來源 19）。2026 上半年與阿斯利康交易首付款 12 億美元（媒體統計，來源 8）。\n- **主要客戶與營收占比**：五大客戶佔收入少於 30%（來源 20）；具名：公開資訊有限。\n- **主要供應商**：五大供應商佔採購少於 30%（來源 20）。\n- **近 3 年營收與獲利**（人民幣億元；來源 19）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 314.5 | 290.1（−7.8%） | 260.1（−10.4%） |\n| 淨利潤 | 58.7 | 43.3（−26.3%） | 38.8（−10.3%） |\n\n- **市值**：約 1,013.7 億港元 ≈ **129 億美元**（2026-10-16；來源 21）\n\n#### (4) 中國生物製藥｜01177.HK\n- **簡介**：研發驅動型綜合藥企，產品涵蓋腫瘤（安羅替尼等）、肝病、呼吸、外科／鎮痛等，並含現代中藥（來源 22）。2025 年收入增長 10.3%，但淨利受非經營因素影響下滑。\n- **主要客戶與營收占比**：五大客戶佔銷售不超過 30%（來源 23）；具名：公開資訊有限。\n- **主要供應商**：五大供應商佔採購不超過 30%（來源 23）。\n- **近 3 年營收與獲利**（人民幣億元；來源 24）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 262.0 | 288.7（+10.2%） | 318.3（+10.3%） |\n| 淨利潤 | 23.3 | 35.0（+50.1%） | 23.4（−33.1%） |\n\n- **市值**：約 935.0 億港元 ≈ **119 億美元**（2026-10-16；來源 22）\n\n#### (5) 三生製藥｜01530.HK\n- **簡介**：生物製藥企業，產品含特比澳（TPIAO）、益比奧（EPIAO）等；2025 年將 PD-1/VEGF 雙抗 SSGJ-707 授權予輝瑞（首付款 12.5 億美元、潛在里程碑最高 48 億美元），2025 年確認授權收入約 94.26 億元（來源 25）。\n- **主要客戶與營收占比**：2025 年五大客戶佔總收益約 60.5%（2024 年 14.0%），單一最大客戶約 53.7%（2024 年 3.8%）（來源 26）；結合授權收入規模，最大客戶與輝瑞授權交易相關，惟年報未具名，屬推斷。\n- **主要供應商**：五大供應商佔採購約 20.3%，最大供應商約 6.4%（來源 26）。\n- **近 3 年營收與獲利**（人民幣億元；來源 27）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 78.2 | 91.1（+16.5%） | 177.0（+94.3%） |\n| 淨利潤 | 15.5 | 20.9（+34.9%） | 84.8（+305.8%） |\n\n- **市值**：約 360.6 億港元 ≈ **46 億美元**（2026-10-16；來源 28）\n\n---\n\n## 3. 產業重要趨勢\n\n1. **創新藥收入佔比上升成為盈利主引擎**：翰森 2025 年創新藥與合作產品收入佔 82.2%，2026H1 創新藥收入佔 85.4%（來源 10、13）；石藥則顯示集採／價格壓力下傳統成藥收入下滑（來源 19）。行業分化在於「創新收入能否覆蓋仿製藥降價」。\n2. **對外授權規模創新高、收入結構一次性化**：2026H1 對外授權交易額超千億美元（來源 7），三生 2025 年授權收入佔收入過半（來源 25、27）。首付款帶來利潤跳升，但可持續性取決於里程碑兌現。\n3. **定價機制由「壓價」轉向「分層定價」**：國辦發 9 號區分高水平創新藥、改良新藥與通用名藥，並強化商保多元支付及真實世界研究評估（來源 5）。\n4. **集採持續擴面並強調「反內卷」**：第 12 批集採對異常低價設兩檔防範措施，強調穩臨床、保質量（來源 2）；集採覆蓋面擴大意味仿製藥收入長期承壓。\n5. **行業整體增長放緩**：2026 年 1–8 月醫藥製造業收入 −0.3%、利潤 +3.9%（來源 1），結構性增長集中於創新藥企。\n\n---\n\n## 4. 未來 12 個月催化劑與風險\n\n### 潛在正面\n- **2026 年醫保目錄／商保創新藥目錄結果公布**（方案 2026-05-31 發布，來源 6）：新增創新藥准入可帶動放量；商保目錄為高價創新藥提供額外支付渠道（來源 5）。\n- **首發價格機制落地**：高水平創新藥上市初期價格相對穩定，改善新藥回報預期（來源 5）。\n- **BD 里程碑與海外獲批**：翰森阿美替尼已於 2026-02 獲歐盟批准，HS-20118 授權含最高 21.8 億美元里程碑（來源 10）；行業 BD 規模擴大（來源 7）。\n- **管線進入註冊期**：翰森 2026H1 新增 3 項上市申請獲受理、3 項 III 期（來源 29）。\n\n### 潛在負面\n- **集採擴面衝擊仿製藥**：第 12 批集採結果年內實施（來源 30）；公開中選名單顯示江蘇豪森（翰森附屬）為恩紮盧胺中選企業之一（第三方整理，來源 31），相關產品價格或下行（翰森恩紮盧胺軟膠囊列於其腫瘤產品組合，來源 10）。\n- **授權收入一次性與可比基數**：三生 2025 年高基數（來源 27）；SA 數據顯示其 TTM 收入增長已回落至約 +1%（來源 27）。\n- **醫保談判降價幅度不確定**：支付標準須「在醫保基金可承受前提下」形成（來源 5）。\n- **行業收入停滯**：醫藥製造業 1–8 月收入負增長（來源 1） 本報告未重算。n=1；5d −1.0%、20d +5.8%；5d 廣度 0%（較前值 −100 ppt）。訊號完全等同單一成份股波動。\n- **資料新鮮度**：公司數據以 2025 年報（2026-04）及 2026 中期業績（2026-07／08）為主；行業統計至 2026 年 1–8 月（國家統計局 2026-09-28）；市值以 2026-10-16 收市計。截至本更新日未見農夫山泉 2026 前三季數據（港股半年報披露制）。\n- **非投資建議。**\n\n---\n\n## 1. 產業運作方式\n\n**產業範圍。** 中國非酒精飲料（軟飲料）涵蓋包裝飲用水、即飲茶、功能飲料（能量／電解質）、果汁、碳酸飲料、咖啡及植物蛋白飲料等。國家統計局口徑「酒、飲料和精製茶製造業」2026 年 1–8 月營業收入 9,018.2 億元（同比 −7.7%）、利潤總額 1,431.0 億元（−34.7%）（來源 1）；該口徑含白酒，跌幅不宜直接套用於軟飲料，但反映消費品製造整體偏弱。\n\n**主要商業模式。**\n1. **品牌＋大單品驅動**：龍頭以少數億元級單品支撐規模，如農夫山泉的天然水與東方樹葉、東鵬的能量飲料與「補水啦」電解質水（來源 2、3）。\n2. **多層經銷＋終端冰櫃網絡**：廠商向經銷商預收款發貨，經銷商覆蓋小店、商超、餐飲及即時零售；農夫、康師傅等五大客戶佔收入均少於 30%（來源 4、5），客戶高度分散。\n3. **產能貼近市場＋水源地資源**：包裝水運輸半徑短、單價低，產能佈局與物流成本決定盈利；農夫山泉以自有水源地建廠為壁壘（來源 2）。\n4. **成本轉嫁**：主要成本為 PET 瓶胚、紙箱、糖、茶葉及果汁原料；PET 價格波動直接影響毛利率（來源 2、6）。\n\n**關鍵成功因素。** (i) 品牌心智與品類定義權（如無糖茶）；(ii) 渠道密度與終端執行；(iii) 新品孵化與健康化（減糖、無糖、功能化）；(iv) 規模化採購與產能網絡；(v) 價格體系管控，避免價格戰侵蝕。\n\n**當前週期。** 包裝水進入存量競爭與價格戰，第三方報道指 2026H1 包裝飲用水市場銷量／銷售額同比下滑（來源 7）；而無糖茶、功能／電解質飲料維持增長，成為龍頭增量來源（來源 2、3、8）。\n\n---\n\n## 2. 價值鏈分析\n\n```mermaid\nflowchart LR\n  A[上游：PET 樹脂/瓶胚、紙箱、糖、茶葉、果汁濃縮液、水源地] --> B[中游：飲料品牌商<br/>研發｜灌裝｜品牌營銷]\n  B --> C[經銷商／批發商]\n  C --> D[終端：便利店/小店｜商超｜餐飲｜電商與即時零售｜會員店]\n  D --> E[消費者]\n```\n\n| 環節 | 特點 | 議價力 |\n|---|---|---|\n| 上游 | PET 屬石化下游商品，價格隨油價／供需波動 | 品牌商可透過鎖價、規模採購部分對沖（來源 6） |\n| 中游 | 品牌商掌握定價與渠道 | 龍頭盈利能力差異大：農夫 2026H1 毛利率約 60.9%（來源 2）；康師傅 2025 年淨利潤率約 5.7%（45.0/790.7，來源 10） |\n| 渠道 | 多層經銷、預收款 | 集中度低，無單一大客戶（來源 4、5） |\n\n### 主要參與者（市值以 2026-10-16 收市計；HKD→USD 7.8476、CNY→USD 6.7220，來源 11、12）\n\n#### (1) 農夫山泉｜9633.HK｜Dashboard 成份股\n- **簡介**：中國包裝飲用水及軟飲料龍頭，五大分部為包裝水、即飲茶（東方樹葉、茶π等）、功能飲料、果汁及其他。2026H1 收益約 297.18 億元（+16.0%）、母公司擁有人應佔溢利約 88.87 億元（+16.6%）；茶飲料收益約 131.22 億元（+30.1%），佔比約 44.2%，包裝水收益僅約 +2.1%；毛利率約 60.9%（來源 2）。\n- **主要客戶與營收占比**：2025 年五大客戶銷售合計少於 30%（來源 4）；具名客戶：公開資訊有限。\n- **主要供應商**：五大供貨商採購合計少於 30%（來源 4）；具名：公開資訊有限。\n- **近 3 年營收與獲利**（人民幣億元；來源 9）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收益 | 426.7 | 429.0（+0.5%） | 525.5（+22.5%） |\n| 淨利潤 | 120.8 | 121.2（+0.4%） | 158.6（+30.8%） |\n\n- **市值**：約 4,633.5 億港元 ≈ **590 億美元**（2026-10-16；來源 13）\n\n#### (2) 華潤飲料｜2460.HK\n- **簡介**：「怡寶」純淨水品牌擁有者，產品以包裝飲用水為主，亦有茶飲（至本清潤、佐味茶事等）。2026H1 收入 54.55 億元（−12.1%），歸屬股東利潤 5.92 億元（約 −26%）；包裝水收入 48.38 億元（−7.9%，佔 88.7%），飲料收入 6.17 億元（−35.4%）（來源 14）。\n- **主要客戶與營收占比**：2025 年最大客戶佔收入 6.9%，前五大客戶佔 16.8%（來源 15）。\n- **主要供應商**：最大供應商佔採購 9.5%，前五大佔 25.3%（來源 15）。\n- **近 3 年營收與獲利**（人民幣億元；來源 16）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 135.2 | 135.2（+0.0%） | 110.0（−18.6%） |\n| 淨利潤 | 13.3 | 16.4（+23.2%） | 9.8（−39.8%） |\n\n- **市值**：約 173.1 億港元 ≈ **22 億美元**（2026-10-16；來源 17）\n\n#### (3) 康師傅控股｜0322.HK\n- **簡介**：方便麵及飲料龍頭，飲料業務含即飲茶、果汁、包裝水，並透過合作經營百事碳酸飲料。2025 年飲料分部收入約 501.2 億元，佔集團收入逾六成（來源 10）。\n- **主要客戶與營收占比**：五大客戶佔銷售少於 30%（來源 5）。\n- **主要供應商**：五大供應商佔採購少於 30%（來源 5）。\n- **近 3 年營收與獲利**（人民幣億元；來源 10）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 804.2 | 806.5（+0.3%） | 790.7（−2.0%） |\n| 淨利潤 | 31.2 | 37.3（+19.8%） | 45.0（+20.5%） |\n\n- **市值**：約 697.3 億港元 ≈ **89 億美元**（2026-10-16；來源 18）\n\n#### (4) 統一企業中國｜0220.HK\n- **簡介**：台灣統一企業旗下中國業務，飲料（茶飲、果汁、奶茶、咖啡）與方便麵並重；2025 年飲料分部收入約 194.7 億元（來源 19）。\n- **主要客戶與營收占比**：五大客戶佔收入少於 30%（來源 20）。\n- **主要供應商**：五大供應商佔採購約 51.23%，最大供應商約 25.78%；控股股東統一企業為五大供應商之一（來源 20）。\n- **近 3 年營收與獲利**（人民幣億元；來源 19）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 285.9 | 303.3（+6.1%） | 317.1（+4.6%） |\n| 淨利潤 | 16.7 | 18.5（+10.9%） | 20.5（+10.9%） |\n\n- **市值**：約 331.9 億港元 ≈ **42 億美元**（2026-10-16；來源 21）\n\n#### (5) 東鵬飲料｜605499.SH／09980.HK\n- **簡介**：中國能量飲料龍頭，並拓展電解質水「補水啦」、茶飲及咖啡。2026H1 營業收入 124.43 億元（+15.89%）、歸母淨利潤 28.67 億元（+20.72%）；電解質飲料收入 16.72 億元（+11.98%），佔主營 13.45%（來源 3）。\n- **主要客戶與營收占比**：公開資訊有限（本報告未取得 A 股年報客戶集中度原文）。\n- **主要供應商**：公開資訊有限。\n- **近 3 年營收與獲利**（人民幣億元；來源 22）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 營業收入 | 112.6 | 158.4（+40.6%） | 208.8（+31.8%） |\n| 淨利潤 | 20.4 | 33.3（+63.1%） | 44.1（+32.7%） |\n\n- **市值**：約 812.5 億元人民幣（SA 口徑，股本 7.27 億股，可能未完整計入 H 股，此為估計）≈ **121 億美元**（2026-10-16；來源 23）\n\n---\n\n## 3. 產業重要趨勢\n\n1. **包裝水由增量轉存量、價格戰延續**：農夫 2026H1 包裝水僅 +2.1%（來源 2），華潤飲料包裝水 −7.9%（來源 14）；第三方指 2026H1 包裝水市場量額同比下滑（來源 7）。\n2. **無糖茶成第一增長曲線**：農夫茶飲料 +30.1%、佔比 44.2%，明顯超過包裝水（約 32.4%）成為第一大品類（來源 2）；反之華潤飲料飲料業務 −35.4%（來源 14），顯示品類紅利向品牌龍頭集中。\n3. **功能化／電解質化**：東鵬電解質飲料 +11.98%（來源 3）；農夫功能飲料約 +15.5%（來源 2、24）；行業跟蹤研報認為無糖茶、功能飲料景氣相對確定（來源 8）。\n4. **成本端回升**：農夫披露 PET 採購價上升；媒體指 PET 價格自約 6,300 元／噸升至約 9,000 元／噸量級（來源 2、6）。\n5. **龍頭盈利分化**：農夫 2025 年淨利 +30.8%、東鵬 +32.7%，而華潤飲料 −39.8%（來源 9、16、22）。\n\n---\n\n## 4. 未來 12 個月催化劑與風險\n\n### 潛在正面\n- **茶飲與功能飲料持續放量**：若無糖茶維持雙位數增長，可抵銷包裝水疲弱（來源 2、8）。\n- **龍頭份額集中**：價格戰中弱勢品牌（如華潤飲料飲料業務下滑，來源 14）讓出份額，利好渠道與品牌較強者（推論）。\n- **盈利改善的防守型龍頭**：康師傅、統一中國 2025 年淨利分別 +20.5%、+10.9%（來源 10、19），在收入平淡下以成本與結構改善支撐盈利。\n\n### 潛在負面\n- **包裝水價格戰再起**：直接壓縮行業定價錨與毛利（來源 7、14）。\n- **PET 成本壓力於下半年顯現**：鎖價庫存消耗後成本上升或與促銷加劇疊加（來源 6）。\n- **消費品製造景氣疲弱**：「酒、飲料和精製茶製造業」1–8 月利潤 −34.7%（來源 1）。\n- **高基數**：農夫 2025 年收益 +22.5%、淨利 +30.8%（來源 9），2026H2 起面對高基數，增速放緩風險上升（推論）。\n- **n=1 技術風險**：行業組技術訊號完全由農夫主導。\n\n---\n\n## 5. 資料限制\n- 國家統計局口徑含酒類，非純軟飲料數據。\n- 包裝水市場量額下滑、PET 價格屬第三方／媒體報道，未核對原始數據庫。\n- 東鵬客戶／供應商集中度及 H 股計入後的總市值未能取得原文。\n- 3 年財務為 S&P Global MI 標準化口徑。\n- 技術數據截至 2026-10-16，未重算。\n\n## 6. 來源列表\n| # | 機構／文件 | 日期 | URL |\n|---|---|---|---|\n| 1 | 國家統計局：2026年1—8月份規模以上工業企業利潤 | 2026-09-28 | https://www.stats.gov.cn/sj/zxfb/202609/t20260928_1965425.html |\n| 2 | 農夫山泉 2026 中期業績公告（HKEX） | 2026-08-25 | https://www.hkexnews.hk/listedco/listconews/sehk/2026/0825/2026082501293_c.pdf |\n| 3 | 東鵬飲料 2026 年半年度報告（巨潮資訊） | 2026-07-31 | https://static.cninfo.com.cn/finalpage/2026-07-31/1225449594.PDF |\n| 4 | 農夫山泉 2025 年度報告（HKEX） | 2026-04-17 | https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0417/2026041701390_c.pdf |\n| 5 | 康師傅控股 2025 年報（HKEX） | 2026-04-27 | https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0427/2026042700362_c.pdf |\n| 6 | 界面新聞：PET 成本報道 | 2026-08 | https://www.jiemian.com/article/15009129.html |\n| 7 | 東方財富網：包裝水行業報道 | 2026-09 | https://finance.eastmoney.com/a/202609153875095988.html |\n| 8 | 軟飲料行業跟蹤報告（東方財富研報 PDF） | 約 2026-04 | https://pdf.dfcfw.com/pdf/H3_AP202604171821 **：公司數據以 2025 年報（2026-03／04）及 2026 中期業績（2026-07／08）為主；行業統計至 2026 年 1–8 月（工信部 2026-09-28）；市值以 2026-10-16 收市計。截至本更新日未見三大運營商 2026 年第三季度經營數據。\n- **非投資建議。**\n\n---\n\n## 1. 產業運作方式\n\n**產業格局。** 中國基礎電信由中國移動、中國電信、中國聯通三家央企主導，另有中國廣電；鐵塔基礎設施集中於中國鐵塔。2026 年 1–8 月全國電信業務收入 1.16 萬億元，同比 −2.2%；但以上年不變價計算的電信業務總量 +7.6%（來源 1），量增而價（收入）承壓。截至 8 月末移動電話用戶 18.49 億戶，其中 5G 用戶 13.11 億戶（佔 70.9%）；固網寬帶用戶 7.04 億戶（來源 1）。\n\n**主要商業模式。**\n1. **連接（通信服務）**：移動語音／流量、固網寬帶、融合套餐；以 ARPU×用戶數變現，通話及短信持續萎縮（1–8 月移動通話時長 −6.7%、短信收入 −12.4%，來源 1）。\n2. **算力與雲（第二曲線）**：IDC、公有雲（天翼雲、移動雲、聯通雲）、智算及 AI 平台，為政企／互聯網客戶提供雲網一體服務（來源 2、3、4）。\n3. **共享基礎設施**：運營商向中國鐵塔租用鐵塔、室分及能源服務，鐵塔約 85% 收入來自運營商（來源 5）。\n4. **香港市場**：HKT 等以固網、流動、媒體（Now TV）及企業方案為主，屬成熟高派息模式（來源 6）。\n\n**關鍵成功因素。** (i) 頻譜與網絡覆蓋（5G 基站 519.5 萬個，佔移動基站 39.7%，來源 1）；(ii) 資本開支紀律與自由現金流；(iii) 政企／算力業務的增長與毛利；(iv) 國資考核與派息政策；(v) 監管及稅務口徑（2026 年起部分增值電信業務改按基礎電信 9% 稅率計稅，影響報表收入，來源 2、3、4）。\n\n---\n\n## 2. 價值鏈分析\n\n```mermaid\nflowchart LR\n  A[上游：通信設備（無線/光通信）、服務器與GPU、終端廠商、電力] --> B[基礎設施：中國鐵塔<br/>鐵塔｜室分｜能源]\n  A --> C[中游：基礎電信運營商<br/>移動｜電信｜聯通｜廣電]\n  B --> C\n  C --> D[下游：個人/家庭客戶（流量、寬帶、融合套餐）]\n  C --> E[下游：政企/互聯網客戶（雲、IDC、智算、專網）]\n```\n\n| 環節 | 特點 | 議價力 |\n|---|---|---|\n| 上游 | 設備商、服務器／AI 芯片供應集中 | 移動前五大供應商佔採購約 21%（來源 7） |\n| 基礎設施 | 鐵塔共享，客戶極度集中 | 鐵塔前五大客戶佔 85.4%（來源 5），對運營商依賴高 |\n| 運營商 | 三家寡頭、國資背景 | 客戶極分散：移動前五大客戶僅佔約 3%（來源 7） |\n\n### 主要參與者（市值以 2026-10-16 收市計；HKD→USD 7.8476、CNY→USD 6.7220，來源 8、9）\n\n#### (1) 中國移動｜0941.HK（亦有 600941.SH）｜Dashboard 成份股\n- **簡介**：全球客戶規模最大的電信運營商。2026H1 營運收入 5,380 億元（−1.1%，剔除增值稅稅目調整同口徑正增長）；股東應佔利潤 789 億元（−6.3%）；移動客戶 10.11 億戶；中期股息每股人民幣 2.51 元（來源 2）。算力服務收入約 529 億元（+14.0%）（來源 2）。\n- **主要客戶與營收占比**：2025 年五大客戶銷售約人民幣 347 億元，佔約 3%（來源 7）。\n- **主要供應商**：五大供應商採購約人民幣 1,550 億元，佔約 21%；最大供應商約 7%（來源 7）。\n- **近 3 年營收與獲利**（人民幣億元；來源 10）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 營運收入 | 10,093.1 | 10,407.6（+3.1%） | 10,501.9（+0.9%） |\n| 淨利潤 | 1,317.7 | 1,383.7（+5.0%） | 1,371.0（−0.9%） |\n\n- **市值**：約 1.79 萬億港元 ≈ **2,281 億美元**（2026-10-16；來源 11）\n\n#### (2) 中國電信｜0728.HK（亦有 601728.SH）｜Dashboard 成份股\n- **簡介**：固網寬帶及雲業務領先運營商，旗下天翼雲。2026H1 經營收入 2,605 億元（上年同期 2,714.69 億元），主營收入 2,441 億元（可比口徑基本穩定）；股東應佔利潤 195.88 億元（上年同期 230.17 億元）；天翼雲收入 618 億元（+7.8%）、智能收入 311 億元（+7.1%）；中期派息比例 75%（來源 3）。\n- **主要客戶與營收占比**：五大客戶佔收入少於 30%（來源 12）。\n- **主要供應商**：五大供應商佔採購少於 30%（來源 12）。\n- **近 3 年營收與獲利**（人民幣億元；來源 13）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 經營收入 | 5,135.5 | 5,235.7（+2.0%） | 5,239.2（+0.1%） |\n| 淨利潤 | 304.5 | 330.1（+8.4%） | 331.9（+0.5%） |\n\n- **市值**：約 6,883.5 億港元 ≈ **877 億美元**（2026-10-16；SA 口徑以 A+H 總股本乘 H 股價估算；來源 14）\n\n#### (3) 中國聯通｜0762.HK（A 股母公司 600050.SH）｜Dashboard 成份股\n- **簡介**：第三大運營商，聚焦聯網通信、算力、數字服務及安全。2026H1 營業收入 2,014 億元（+0.6%）、服務收入 1,780 億元（−0.2%）；股東應佔利潤 95 億元（−34.6%），公司歸因於增值稅及員工福利費用投放時點；算力收入 419 億元（+13%）；資本開支 241 億元，算力投資佔比 37%（來源 4）。\n- **主要客戶與營收占比**：五大客戶佔收入不超過 30%（來源 15）。\n- **主要供應商**：五大供應商佔採購不超過 30%（來源 15）。\n- **近 3 年營收與獲利**（人民幣億元；來源 16）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 營業收入 | 3,726.0 | 3,895.9（+4.6%） | 3,922.2（+0.7%） |\n| 淨利潤 | 187.3 | 206.1（+10.0%） | 208.2（+1.0%） |\n\n- **市值**：約 1,718.1 億港元 ≈ **219 億美元**（2026-10-16；來源 17）\n\n#### (4) 中國鐵塔｜0788.HK\n- **簡介**：全球最大通信鐵塔基礎設施服務商，業務含塔類、室分、智聯（兩翼）及能源。2026H1 營業收入 486.93 億元（−1.8%）、歸屬股東淨利潤 74.89 億元（+30.1%）；塔類收入 352.63 億元（−6.7%），受運營商網絡優化、極簡站改造及電信與聯通「4G 一張網」共建共享影響（來源 18）。\n- **主要客戶與營收占比**：2025 年五大客戶（含移動、電信、聯通集團）佔 85.4%，最大客戶佔 42.4%（來源 5）。\n- **主要供應商**：五大供應商佔採購少於 30%（來源 5）。\n- **近 3 年營收與獲利**（人民幣億元；來源 19）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 營業收入 | 940.1 | 977.7（+4.0%） | 1,004.1（+2.7%） |\n| 淨利潤 | 97.5 | 107.3（+10.1%） | 116.3（+8.4%） |\n\n- **市值**：約 1,592.5 億港元 ≈ **203 億美元**（2026-10-16；來源 20）\n\n#### (5) 香港電訊 HKT｜6823.HK\n- **簡介**：香港最大綜合電訊營運商，業務含固網寬帶、流動通訊（csl、1O1O）、企業方案及 Now TV 等。2026H1 總收益 186.85 億港元（+8%）、經調整資金流 26.39 億港元（+3%）、股份合訂單位持有人應佔溢利 21.53 億港元（+4%）；中期分派每單位 34.80 港仙（來源 6）。\n- **主要客戶與營收占比**：五大客戶佔收益少於 30%（來源 21）。\n- **主要供應商**：五大供應商佔採購少於 30%（來源 21）。\n- **近 3 年營收與獲利**（港元億元；來源 22）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 總收益 | 343.3 | 347.5（+1.2%） | 365.5（+5.2%） |\n| 淨利潤 | 49.9 | 50.7（+1.6%） | 52.9（+4.3%） |\n\n- **市值**：約 915.2 億港元 ≈ **117 億美元**（2026-10-16；來源 23）\n\n---\n\n## 3. 產業重要趨勢\n\n1. **連接業務「量增價減」**：1–8 月電信業務收入 −2.2%、業務總量 +7.6%，移動流量 +17.3%、8 月 DOU 23.45GB（+12.4%）（來源 1）；移動 2026H1 移動通信服務收入約 3,504 億元（−5.7%）（來源 2）。\n2. **增值稅稅目調整扭曲可比口徑**：財稅公告 2026 年第 9 號自 2026-01-01 起，流量、短信、寬帶接入等由增值電信（6%）調為基礎電信（9%），三家中期均以「同口徑／可比口徑」另行披露（來源 2、3、4）。\n3. **算力／AI 成第二曲線**：移動算力服務約 +14.0%、智算 +130.1%（來源 2）；聯通算力收入 +13%、算力投資佔資本開支 37%（來源 4）；電信天翼雲 +7.8%、推「Token 經營」（來源 3）。\n4. **資本開支結構轉向**：聯通資本開支 241 億元中算力佔 37%（來源 4）；電信上半年資本開支 324 億元（來源 3），傳統無線網投資讓位於算力。\n5. **共建共享壓縮鐵塔租金**：鐵塔塔類收入 −6.7%（來源 18），反映運營商以網絡優化降本。\n6. **現金流與派息成估值核心**：移動自由現金流 539 億元（+111.6%）（來源 2）；電信自由現金流 289 億元（+121.3%）、派息比例提升至 75%（來源 3）。\n\n---\n\n## 4. 未來 12 個月催化劑與風險\n\n### 潛在正面\n- **全年利潤降幅收窄**：聯通指全年員工福利費用預期平穩、利潤降幅將明顯收窄（來源 4），若兌現可修復情緒。\n- **算力收入加速**：智算需求及國產算力建設推動 IDC／雲收入（來源 2、3、4）。\n- **自由現金流大增支撐派息**：移動、電信自由現金流翻倍（來源 2、3），利好高股息配置邏輯。\n- **5G／千兆滲透持續提升**：千兆寬帶用戶 2.63 億戶、佔 37.3%（來源 1），支撐融合套餐 ARPU。\n\n### 潛在負面\n- **增值稅影響全年報表**：報表收入與利潤口徑下滑或持續至 2026 全年（來源 2、3、4）。\n- **傳統通信收入萎縮**：移動通信服務收入 −5.7%（來源 2）；若價格競爭加劇，ARPU 承壓。\n- **聯通中期不派息**（來源 4），削弱高股息標籤，或加劇組內分化。\n- **算力投資回報不確定**：資本開支轉向算力，若利用率／定價不及預期，折舊上升侵蝕利潤（推論）。\n- **高位轉弱技術風險**：廣度由高位降至 33%，n=3 且權重集中移動，訊號易受單股主導。\n\n---\n\n## 5. 資料限制\n- 中國電信、中國聯通 H1 同比變化部分以公告原值自行計算或依公司文字；三家「同口徑」增速公司未全部披露具體百分比。\n- 中國電信市值為 SA 以 A+H 總股本乘 H 股價估算，非 H 股流通市值。\n- 移動「智算 +130.1%」、算力收入 529 億元取自內部筆記所核對的中期公告。\n- 3 年財務為 S&P Global MI 標準化口徑，可能與公司公告略有差異。\n- 各公司具名客戶／供應商公開資訊有限（鐵塔除外）。\n- 技術數據截至 2026-10-16，未重算。\n\n## 6. 來源列表\n| # | 機構／文件 | 日期 | URL |\n|---|---|---|---|\n| 1 | 工業和信息化部：2026年前8個月通信業經濟運行情況 | 2026-09-28 | https://www.miit.gov.cn/jgsj/yxj/xxfb/art/2026/art_5fb391bfb8dd487ca5c89cf0f3bab44c.html |\n| 2 | 中國移動 2026 年中期業績公告（HKEX） | 2026-08-13 | https://www.hkexnews.hk/listedco/listconews/sehk/2026/0813/2026081300219_c.pdf |\n| 3 | 中國電信 2026 年中期業績公佈（HKEX） | 2026-08-20 | https://www.hkexnews.hk/listedco/listconews/sehk/2026/0820/2026082000376_c.pdf |\n| 4 | China Unicom 2026 Interim Results 821_c.pdf |\n| 22 | StockAnalysis：HKT 財務摘要 | 2026-10-16 查閱 | https://stockanalysis.com/quote/hkg/6823/financials/ |\n| 23 | StockAnalysis：HKT 概覽 | 2026-10-16 | https://stockanalysis.com/quote/hkg/6823/ |\n", "real-estate-services": "# 地產服務行業研究報告｜轉弱觀察\n\n- **更新日**：2026-10-18（Asia/Hong_Kong）\n- **Dashboard 標籤**：轉弱觀察｜行業組「地產服務」（Real Estate Services）｜成份股 0101.HK 恒隆地產、1209.HK 華潤萬象生活、1997.HK 九龍倉置業（n=3）\n- **技術備註**：技術數據截至 2026-10-16，由 HK Indices DB 提供，本報告未重算。n=3；5d −0.4%、20d +1.4%；5d 廣度 33%（較前值 −33 ppt）。組內分化大。\n- **資料新鮮度**：公司數據以 2025 年報（2026-03／04）及 2026 中期業績（2026-07／08）為主；內地房地產統計至 2026 年 1–8 月（國家統計局 2026-09-15）；市值以 2026-10-16 收市計。\n- **非投資建議。**\n\n---\n\n## 1. 產業運作方式\n\n**產業範圍。** 本 Dashboard 的「地產服務」行業組按國際分類口徑，涵蓋兩類港股：(i) **商業地產持有及營運商**（收租股，如恒隆地產、九龍倉置業、太古地產），以購物中心、寫字樓及酒店租金為主要收入；(ii) **物業管理及商業運營服務商**（如華潤萬象生活、中海物業），按管理面積收取物管費，並提供購物中心輕資產運營。兩者與開發商不同，收入以經常性租金／服務費為主。\n\n**行業背景。** 內地開發端仍深度調整：2026 年 1–8 月全國房地產開發投資 47,979 億元（同比 −19.9%）、新建商品房銷售額 47,470 億元（−13.0%）、房屋竣工面積 −23.7%；二手房網簽面積則 +10.6%（來源 1）。竣工及新盤交付收縮，直接減少物管新增面積及案場等「非業主增值服務」（來源 2）。\n\n**主要商業模式。**\n1. **重資產收租**：持有核心地段商場與寫字樓，收入＝面積×租用率×租金（含零售額分成），受消費及辦公需求驅動，並有公允值重估波動（來源 3、4）。\n2. **物管「包乾制」**：按面積收取固定物管費，毛利率低、收繳率決定現金流（來源 5、6）。\n3. **輕資產商管**：為母公司或第三方商場提供招商與運營，收取管理費，毛利率較物管高（來源 2）。\n\n**關鍵成功因素。** (i) 資產區位與品牌（高端商場抗週期）；(ii) 母公司資源（關聯方面積、商場儲備）；(iii) 第三方外拓與收繳能力；(iv) 資產負債表與派息能力；(v) 成本控制（物管人工佔比高）。\n\n---\n\n## 2. 價值鏈分析\n\n```mermaid\nflowchart LR\n  A[上游：土地/開發商、建築商、設備維保、保安保潔外包、能源] --> B[中游一：商業地產持有人<br/>商場｜寫字樓｜酒店]\n  A --> C[中游二：物管/商管服務商<br/>住宅物管｜商場運營｜城市服務]\n  B --> D[下游：零售租戶、企業租戶、酒店客人]\n  C --> E[下游：業主/住戶、開發商（案場/交付服務）、地方政府]\n  B -.委託運營.-> C\n```\n\n| 環節 | 特點 | 關鍵風險 |\n|---|---|---|\n| 開發商 | 交付面積決定物管增量 | 竣工面積 −23.7%（來源 1） |\n| 收租業主 | 租金與重估 | 寫字樓租金下行、重估減值（來源 3、4） |\n| 物管／商管 | 經常性收費 | 收繳率下滑、降價壓力（來源 5、6、7） |\n\n### 主要參與者（市值以 2026-10-16 收市計；HKD→USD 7.8476，來源 8）\n\n#### (1) 恒隆地產｜0101.HK｜Dashboard 成份股\n- **簡介**：香港及內地高端商場與寫字樓持有人，內地「66」系列商場（上海港匯恒隆、恒隆廣場等）為核心。2026H1 物業租賃收入約 49.23 億港元（+5%）；內地商場收入按人民幣計約 +6%、租出率約 96%、租戶銷售額約 +17%；內地辦公樓租賃收入約 −12%（來源 3）。\n- **主要客戶與營收占比**：五大客戶佔收入不超過 30%（來源 9）。\n- **主要供應商**：五大供應商佔採購不超過 30%（來源 9）。\n- **近 3 年營收與獲利**（港元億元；來源 10）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 103.5 | 112.7（+8.9%） | 99.5（−11.7%） |\n| 淨利潤 | 39.7 | 21.5（−45.8%） | 18.1（−16.1%） |\n\n- **市值**：約 333.0 億港元 ≈ **42 億美元**（2026-10-16；來源 11）\n\n#### (2) 華潤萬象生活｜1209.HK｜Dashboard 成份股\n- **簡介**：華潤置地旗下物管及商業運營平台，業務分為物業管理及商業運營（購物中心「萬象城」等）。2026H1 收入約 92.17 億元（+8.1%）、核心淨利約 22.29 億元（+10.8%），中期加特別股息約對應核心淨利 100% 分派；非業主增值服務約 −10.3%（來源 2）。\n- **主要客戶與營收占比**：2025 年五大客戶佔 35.5%，最大客戶華潤置地佔 28.1%（來源 12）。\n- **主要供應商**：五大供應商佔 7.5%，最大供應商（華潤置地）佔 3.2%（來源 12）。\n- **近 3 年營收與獲利**（人民幣億元；來源 13）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 147.7 | 171.5（+16.2%） | 180.2（+5.1%） |\n| 淨利潤 | 29.3 | 36.0（+22.8%） | 39.7（+10.3%） |\n\n- 2025 年分部：物業管理約 108.5 億元、商業運營約 69.1 億元（來源 13）。\n- **市值**：約 905.7 億港元 ≈ **115 億美元**（2026-10-16；來源 14）\n\n#### (3) 九龍倉置業｜1997.HK｜Dashboard 成份股\n- **簡介**：持有海港城、時代廣場等香港核心商場、寫字樓及酒店。2026 年中期基礎淨利約 33.11 億港元（+6%）；派息比率由 65% 調升至 90%，第一次中期息每股 94 港仙（+42%）；資產出售完成後負債率目標約 11%；投資物業收入約 −2%（來源 4）。\n- **主要客戶與營收占比**：五大客戶佔收入少於 30%（來源 15）。\n- **主要供應商**：五大供應商佔採購少於 30%（來源 15）。\n- **近 3 年營收與獲利**（港元億元；來源 16）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 133.1 | 129.1（−3.0%） | 128.2（−0.7%） |\n| 淨利潤 | 47.7 | 8.9（−81.3%） | −42.6（報表轉虧） |\n\n- 2025 年分部：投資物業約 106.5 億港元、酒店約 16.3 億港元（來源 16）。\n- **市值**：約 924.8 億港元 ≈ **118 億美元**（2026-10-16；來源 17）\n\n#### (4) 太古地產｜1972.HK\n- **簡介**：太古集團旗下，持有太古廣場、太古坊及內地太古里等。2026H1 收入 94.13 億港元（+8%）；股東應佔基本溢利約 49 億港元（+11%），經常性基本溢利 46.61 億港元（+36%）；寫字樓租金收入 26.38 億港元，與上年大致相約，香港寫字樓租用率約 90%；第一次中期股息每股 0.37 港元（+6%）（來源 18）。\n- **主要客戶與營收占比**：五大客戶佔收入少於 30%（來源 19）。\n- **主要供應商**：五大供應商佔採購少於 30%（來源 19）。\n- **近 3 年營收與獲利**（港元億元；來源 20）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 155.0 | 157.0（+1.3%） | 166.0（+5.7%） |\n| 淨利潤 | 26.4 | −7.7（轉虧） | −15.3（報表虧損擴大） |\n\n- **市值**：約 1,407.1 億港元 ≈ **179 億美元**（2026-10-16；來源 21）\n\n#### (5) 中海物業｜2669.HK\n- **簡介**：中國海外集團旗下物管公司，以住宅及商業物管、增值服務及城市服務為主。2026H1 收益 74.85 億元（+4.5%）、普通股權持有人應佔溢利 7.01 億元（−9.0%）（來源 22）；媒體指毛利率降至 14.9%，受物管費降價壓力影響（來源 7）。\n- **主要客戶與營收占比**：五大客戶佔收入少於 30%（來源 23）。\n- **主要供應商**：五大供應商佔採購少於 30%（來源 23）。\n- **近 3 年營收與獲利**（人民幣億元；來源 24）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收益 | 130.5 | 141.1（+8.1%） | 149.6（+6.0%） |\n| 淨利潤 | 13.4 | 15.1（+12.7%） | 13.7（−9.3%） |\n\n- **市值**：約 109.8 億港元 ≈ **14 億美元**（2026-10-16；來源 25）\n\n---\n\n## 3. 產業重要趨勢\n\n1. **開發端收縮傳導至物管增量**：1–8 月竣工面積 −23.7%、新開工 −24.8%（來源 1）；萬象非業主增值服務 −10.3%（來源 2）。\n2. **物管「質價矛盾」與收繳率下滑**：行業研究指住宅物管收繳率持續下行（來源 5、6）；中海物業「增收不增利」、毛利率降至 14.9%（來源 7、22）。\n3. **高端商場與寫字樓分化**：恒隆內地商場收入 +6%、租戶銷售 +17%，但內地辦公樓 −12%（來源 3）；太古寫字樓租金持平、租用率約 90%（來源 18）。\n4. **收租股轉向「去槓桿＋高派息」**：九倉派息比率升至 90%（來源 4）；萬象核心淨利 100% 分派（來源 2）。\n5. **報表盈利波動大於基礎盈利**：收租股報表淨利潤含投資物業公允值變動；九倉 2025 年報表轉虧、太古 2025 年報表虧損（來源 16、20），而兩者 2026H1 基礎溢利分別 +6%、+11%（來源 4、18）。\n\n---\n\n## 4. 未來 12 個月催化劑與風險\n\n### 潛在正面\n- **高端消費回暖**：恒隆內地商場租戶銷售 +17%（來源 3），若延續可推動分成租金。\n- **派息提升支撐估值**：九倉、萬象的高派息政策（來源 2、4）或吸引收息資金（推論）。\n- **二手房成交回暖**：二手房網簽面積 +10.6%（來源 1），利好存量物管的增值服務（推論）。\n- **商管輕資產擴張**：萬象商業運營佔 2025 年收入約 38%（69.1/180.2，來源 13），毛利較高。\n\n### 潛在負面\n- **竣工及交付持續下滑**：限制物管新增面積與案場服務（來源 1、2）。\n- **收繳率及降價壓力**：壓縮物管毛利與現金流（來源 5、7）。\n- **寫字樓供過於求**：內地辦公樓租金續跌（來源 3）；香港寫字樓租用率約 90%（來源 18），租金修復空間有限（推論）。\n- **重估減值**：若資本化率上升，報表盈利再受壓（來源 16、20）。\n- **關聯方依賴**：萬象最大客戶華潤置地佔 28.1%（來源 12），母公司交付節奏直接影響收入。\n\n---\n\n## 5. 資料限制\n- Dashboard 行業分類把收租股與物管股合併，與純物管指數不同。\n- 九倉中期數據取自媒體報道（881903），未核對公告原文。\n- 收繳率為第三方研究，未取得官方統計。\n- 中海物業毛利率 14.9% 取自媒體報道。\n- 3 年財務為 S&P Global MI 標準化口徑；收租股淨利潤含重估。\n- 具名客戶／供應商公開資訊有限（萬象除外）。\n- 技術數據截至 2026-10-16，未重算。\n\n## 6. 來源列表\n| # | 機構／文件 | 日期 | URL |\n|---|---|---|---|\n| 1 | 國家統計局：2026年1—8月份全國房地產市場基本情況 | 2026-09-15 | https://www.stats.gov.cn/sj/zxfb/202609/t20260915_1965310.html |\n| 2 | 華潤萬象生活 2026 中期業績公告（HKEX） | 2026-08-31 | https://www.hkexnews.hk/listedco/listconews/sehk/2026/0831/2026083100074_c.pdf |\n| 3 | 恒隆地產 2026 中期業績 | 2026-07 | https://www.hanglung.com/getmedia/3efc3e5d-4168-4df3-8698-bd2e609c0e1f/C_HLP-2026-Interim-Re k/listedco/listconews/sehk/2026/0820/2026082000570_c.pdf |\n| 23 | 中海物業 2025 年報（HKEX） | 2026-04-29 | https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0429/2026042900390_c.pdf |\n| 24 | StockAnalysis：中海物業財務摘要 | 2026-10-16 查閱 | https://stockanalysis.com/quote/hkg/2669/financials/ |\n| 25 | StockAnalysis：中海物業概覽 | 2026-10-16 | https://stockanalysis.com/quote/hkg/2669/ |\n", "independent-power-producers": "# 獨立電力生產商行業研究報告｜轉弱觀察\n\n- **更新日**：2026-10-18（Asia/Hong_Kong）\n- **Dashboard 標籤**：轉弱觀察｜行業組「獨立電力生產商」（Independent Power Producers）｜成份股 0006.HK 電能實業、0836.HK 華潤電力（n=2）\n- **技術備註**：技術數據截至 2026-10-16，由 HK Indices DB 提供，本報告未重算。n=2；5d −0.1%、20d +3.3%；5d 廣度 50%（較前值 −50 ppt）。屬廣度收縮型轉弱。\n- **資料新鮮度**：公司數據以 2025 年報（2026-03／04）及 2026 中期業績（2026-08）為主；行業統計至 2026 年 1–8 月（國家統計局 2026-09-28、國家能源局 2026-09）；市值以 2026-10-16 收市計。\n- **非投資建議。**\n\n---\n\n## 1. 產業運作方式\n\n**產業範圍。** 內地「獨立電力生產商」指不擁有輸配電網、向電網企業售電的發電集團（五大六小央企及其上市平台，如華能國際、華潤電力、中國電力）。香港則為受《管制計劃協議》規管的垂直一體化電力公司（中電、港燈），電能實業屬持有港燈及海外受規管電網／發電資產的投資控股公司。\n\n**行業規模。** 2026 年 1–8 月全社會用電量 71,730 億千瓦時（+4.3%）（來源 1）；截至 8 月底全國發電裝機 41.03 億千瓦（+11.1%），其中太陽能 12.99 億千瓦（+16.3%）、風電 6.93 億千瓦（+19.6%）（來源 2）。裝機增速遠超用電增速，利用小時與電價承壓。國家統計局口徑「電力、熱力生產和供應業」1–8 月營業收入 67,008.3 億元（+0.4%），利潤總額 4,462.5 億元（−15.1%）（來源 3）。\n\n**主要商業模式。**\n1. **火電**：收入＝上網電量×電價（中長期合約＋現貨＋容量電價），成本主要為燃料煤；盈利取決於「點火價差」（來源 4）。\n2. **新能源（風、光）**：前期資本開支大、邊際成本近零；新增項目逐步全面入市，電價隨市場化與消納能力下行（來源 4）。\n3. **水電／核電**：電價穩定、受來水影響（來源 6）。\n4. **香港受規管模式**：按准許回報率（固定資產淨值）獲利，盈利與資本投資掛鈎（來源 5、7）。\n\n**關鍵成功因素。** (i) 燃料採購與長協煤比例；(ii) 電源結構與區位（負荷中心、消納條件）；(iii) 電力市場交易能力；(iv) 融資成本及資本開支紀律；(v) 派息與資產循環（分拆、出售）。\n\n---\n\n## 2. 價值鏈分析\n\n```mermaid\nflowchart LR\n  A[上游：煤炭/天然氣、風機與光伏組件、鍋爐汽輪機、工程建設] --> B[中游：發電企業（IPP）<br/>火電｜風電｜光伏｜水電]\n  B --> C[電網：國家電網/南方電網<br/>輸配電與調度]\n  B -.市場化交易/售電公司.-> D\n  C --> D[下游：工業、商業、居民用戶]\n  E[香港：中電/港燈 發-輸-配一體化，受管制計劃協議規管] --> D\n```\n\n| 環節 | 特點 | 議價力 |\n|---|---|---|\n| 上游燃料 | 煤價決定火電成本 | 華能前五大供應商佔 48.69%（來源 8） |\n| 發電 | 分散競爭，央企主導 | 電價受市場化交易壓制（來源 4、6） |\n| 電網 | 壟斷買家 | 華潤電力前五大客戶（均為電網公司）佔 43.42%（來源 9） |\n\n### 主要參與者（市值以 2026-10-16 收市計；HKD→USD 7.8476，來源 10）\n\n#### (1) 華潤電力｜0836.HK｜Dashboard 成份股\n- **簡介**：華潤集團旗下綜合能源公司，火電與可再生能源並重。2026H1 火電核心業務利潤約 30.65 億港元（+16.1%）、附屬售電量 +12.8%；燃煤平均上網電價約 364.0 元／MWh（−7.0%），點火價差約 119.5 元／MWh（收窄約 30.4 元）；可再生能源核心利潤約 39.07 億港元（−30.7%），整體純利約 −15.5%；華潤新能源推進 A 股上市（來源 4）。\n- **主要客戶與營收占比**：2025 年前五大客戶佔 43.42%：國網江蘇 11.36%、國網湖北 9.68%、國網河南 9.29%、廣東電網 6.57%、國網華北分部 6.52%（來源 9）。\n- **主要供應商**：前五大佔 15.70%：中車株洲所 5.17%、中煤能源南京 3.53%、國能銷售滄州 2.75%、上海綠地能源煤炭 2.28%、哈爾濱鍋爐 1.97%（來源 9）。\n- **近 3 年營收與獲利**（港元億元；來源 11）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 營業額 | 1,033.3 | 1,052.8（+1.9%） | 1,020.1（−3.1%） |\n| 淨利潤 | 110.0 | 143.9（+30.8%） | 145.2（+0.9%） |\n\n- 2025 年分部：火電約 764.6 億港元、可再生能源約 255.5 億港元（來源 11）。\n- **市值**：約 1,026.6 億港元 ≈ **131 億美元**（2026-10-16；來源 12）\n\n#### (2) 電能實業｜0006.HK｜Dashboard 成份股\n- **簡介**：長和系公用事業投資平台，持有港燈投資權益及英國、澳洲等地受規管電網、燃氣與發電資產，多數以合營／聯營入賬。2026H1 純利約 147.04 億港元，主要來自出售 UKPN 及 UK Rails 權益；中期息每股 0.78 港元（來源 13）。\n- **主要客戶與營收占比**：最大客戶佔 33.8%、前五大佔 83.1%（為與長江基建等共同持有的合營公司）（來源 14）。\n- **主要供應商**：最大供應商佔 14.7%、前五大佔 37.2%（來源 14）。\n- **近 3 年營收與獲利**（港元億元；來源 15）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 綜合收入 | 12.9 | 9.2（−28.9%） | 7.7（−16.1%） |\n| 淨利潤 | 60.0 | 61.2（+1.9%） | 62.4（+1.9%） |\n\n- 註：主要資產以權益法入賬，綜合收入不反映業務規模；TTM 淨利潤約 179.0 億港元含出售收益（來源 15）。\n- **市值**：約 1,290.4 億港元 ≈ **164 億美元**（2026-10-16；來源 16）\n\n#### (3) 華能國際｜0902.HK／600011.SH\n- **簡介**：中國華能集團旗下最大上市發電平台，火電為主並加速發展風光。2026H1 營業收入 1,069.09 億元（−4.57%）、歸母淨利潤 65.86 億元（−28.89%）；境內平均上網結算電價 463.02 元／MWh（−4.58%）、上網電量 1,995.78 億千瓦時（−2.97%）（來源 6）。\n- **主要客戶與營收占比**：前五大客戶（國網山東、江蘇、浙江、江西及廣東電網）佔 38.15%，最大客戶國網山東約 13.4%（來源 8）。\n- **主要供應商**：前五大（華能集團、中石油、中國電建、華陽新材料、中國能建）佔 48.69%，其中華能集團佔 34.42%（來源 8）。\n- **近 3 年營收與獲利**（人民幣億元；來源 17）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 營業收入 | 2,544.0 | 2,455.5（−3.5%） | 2,292.9（−6.6%） |\n| 淨利潤 | 55.3 | 72.1（+30.4%） | 116.4（+61.4%） |\n\n- **市值**：約 1,254.5 億港元（SA 以 A+H 總股本乘 H 股價估算）≈ **160 億美元**（2026-10-16；來源 18）\n\n#### (4) 中國電力｜2380.HK\n- **簡介**：國家電投集團旗下港股發電平台，清潔能源裝機佔比超八成（來源 26）。2026H1 收入 224.57 億元（−5.87%）、權益持有人應佔利潤 15.08 億元（−46.81%）（來源 19）。\n- **主要客戶與營收占比**：前五大客戶佔 50.83%，最大客戶佔 13.07%（來源 20）。\n- **主要供應商**：前五大佔 38.84%，最大供應商佔 21.18%（來源 20）。\n- **近 3 年營收與獲利**（人民幣億元；來源 21）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 461.4 | 562.2（+21.8%） | 523.9（−6.8%） |\n| 淨利潤 | 26.6 | 33.6（+26.3%） | 29.1（−13.4%） |\n\n- **市值**：約 338.3 億港元 ≈ **43 億美元**（2026-10-16；來源 22）\n\n#### (5) 中電控股｜0002.HK\n- **簡介**：香港最大電力公司，業務覆蓋香港、內地、澳洲（EnergyAustralia）及印度。2026H1 營運盈利（計入公平價值變動前）57.33 億港元（+9.7%）、總盈利 59.97 億港元（+6.6%）；香港售電量 +3.6%（來源 7）。\n- **主要客戶與營收占比**：五大客戶佔收入少於 30%（來源 23）。\n- **主要供應商**：前五大佔 47.17%，包括 AEMO 13.04%、廣東核電 11.14%（來源 23）。\n- **近 3 年營收與獲利**（港元億元；來源 24）\n\n| 年度 | 2023 | 2024 | 2025 |\n|---|---:|---:|---:|\n| 收入 | 871.7 | 909.6（+4.3%） | 880.2（−3.2%） |\n| 淨利潤 | 66.5 | 117.4（+76.5%） | 104.7（−10.8%） |\n\n- **市值**：約 1,949.2 億港元 ≈ **248 億美元**（2026-10-16；來源 25）\n\n---\n\n## 3. 產業重要趨勢\n\n1. **裝機過剩壓低電價**：裝機 +11.1% 遠高於用電 +4.3%（來源 1、2）；華能境內結算電價 −4.58%（來源 6），華潤燃煤電價 −7.0%（來源 4）。\n2. **火電「量增價減」、價差收窄**：華潤火電售電 +16.9%，但點火價差收窄約 30.4 元／MWh（來源 4）。\n3. **新能源量價雙壓**：華潤風電電價 −6.3%、光伏電價 −9.2%，可再生能源核心利潤 −30.7%（來源 4）；中國電力利潤近腰斬（來源 19）。\n4. **行業利潤由升轉跌**：電力熱力業 1–8 月利潤 −15.1%（來源 3），與 2024–2025 年煤價回落帶來的盈利修復（華能 2025 年淨利 +61.4%，來源 17）形成反差。\n5. **資產循環與分拆**：華潤新能源 A 股上市（來源 4）；電能出售英國資產回籠資金（來源 13）。\n6. **香港受規管業務穩健**：中電香港售電量 +3.6%、營運盈利 +9.7%（來源 7）。\n\n---\n\n## 4. 未來 12 個月催化劑與風險\n\n### 潛在正面\n- **煤價回落**：若標煤價格下行，可修復火電價差（來源 4，推論）。\n- **用電需求維持增長**：1–8 月用電 +4.3%（來源 1），AI 數據中心及電氣化或支撐負荷（推論）。\n- **資本回收及特別派息**：電能出售所得資金的再投資或分派安排（來源 13）。\n- **新能源分拆估值重估**：華潤新能源 A 股上市（來源 4）。\n- **港電穩定回報**：受規管業務為防守型收入（來源 7）。\n\n### 潛在負面\n- **2027 年年度長協電價下調**：若裝機過剩延續，電價或進一步走低（推論，基於來源 2、6）。\n- **新能源電價全面市場化**：利用小時及棄風棄光壓力（來源 4）。\n- **行業盈利下行**：電力熱力業利潤 −15.1%（來源 3）。\n- **電能盈利基數失真**：2026H1 純利含一次性出售收益（來源 13），2027 年同比基數高。\n- **n=2 技術風險**：組內兩股商業模式差異大，訊號易受單股主導。\n\n---\n\n## 5. 資料限制\n- Dashboard 分類把電能實業（投資控股）與華潤電力（內地 IPP）並列，商業模式不可直接比較。\n- 華能、中國電力中期數據部分取自公司報告搜尋摘要及格隆匯報道，未逐項核對原文。\n- 華能市值為 A+H 總股本乘 H 股價估算 else fetch(id+'.md',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}).catch(()=>{if(EMBED[id])return EMBED[id];throw 0})
 .then(t=>{document.getElementById('out').innerHTML=md(t);const h=document.querySelector('h1,h2');if(h)document.title=h.textContent})
 .catch(()=>{document.getElementById('out').innerHTML='<p>報告撰寫中，稍後再睇。</p>'});
</script></body></html>
